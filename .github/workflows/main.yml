name: addaaat Auto Run

concurrency:
  group: dragon-bot-execution
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PYTHONUNBUFFERED: "1"  # 🔥 يضمن إظهار كل مخرجات بايثون فوراً

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 60  # 🔥 إنهاء المهمة تلقائياً بعد 60 دقيقة لمنع التجمّد

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyTelegramBotAPI telethon requests flask supabase gunicorn

      - name: Run addaaat Bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python -u dra.py  # 🔥 إضافة -u لطباعة المخرجات مباشرة
