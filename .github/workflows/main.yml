name: addaaat Auto Run

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

# 🔥 تم إضافة هذا السطر لحل التحذير وتفعيل Node 24 فوراً وتجنب توقف البوت مستقبلاً
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyTelegramBotAPI telethon requests flask
          
      - name: Run addaaat Bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }} 
        run: python main.py
