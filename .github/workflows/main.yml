name: Run Bot Always
on:
  workflow_dispatch: # هذا يجعله يعمل يدوياً بضغطة زر
  push:
    branches: [ main ] # يعمل عند كل تحديث للكود

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run Bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: python main.py
