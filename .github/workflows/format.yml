name: Run Dragon Bot 24/7

on:
  push:
    branches:
      - main
  workflow_dispatch: # يتيح لك تشغيل البوت يدوياً بضغطة زر من صفحة Actions

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install black telebot pyTelegramBotAPI telethon supabase requests flask gunicorn

      - name: Fix formatting with Black
        run: black dra.py || echo "تم تجاوز التنسيق"

      - name: Commit changes (Auto-Format)
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "🔧 تنسيق تلقائي لملف dra.py"

      - name: Run Dragon Bot in Background & Keep Alive
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          echo "🚀 جاري إطلاق التنين الجبار داخل سيرفر جيت هاب..."
          # تشغيل البوت في الخلفية
          python dra.py &
          
          # حلقة برمجية لمنع الأكشن من الانتهاء والإغلاق
          echo "🛡️ تم تفعيل نظام الحفاظ على استمرار العمل..."
          while ps aux | grep "[d]ra.py" > /dev/null; do
            sleep 30
          done
          echo "⚠️ تنبيه: توقف البوت عن العمل بشكل مفاجئ!"
          exit 1
